# Corrective 45-cell pilot v12: the v11 ReAct truncation/continuation repair
# is frozen as a new experiment.  v11 remains immutable and superseded.
experiment:
  name: phase1_corrected_pilot_v12
  dataset_manifest: benchmark/task_selection.yaml
  prepared_tasks_root: data/phase1/tasks
  agents_manifest: configs/agents.phase1.yaml
  models_manifest: configs/models.yaml
  seed: 1701
  repetitions: 1
  languages: [english, hindi, hinglish]
  tasks:
    - 001-file
    - 016-code-repair-pytest
    - 050-multitable-join-analysis
    - 025-meeting-action-tracker
    - 019-incident-runbook-synthesis
  agents: [react, nanobot, openclaw]
  models: [university_gpu]
  version: corrected-v12

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  max_steps: 40

sandbox:
  mode: docker
  image: indic-harness-phase1:2026-09-21
  network: none

inference:
  provider: university_gpu
  env_file: .env.uni-gpu.local
  requested_model_env: INDIC_UNI_GPU_MODEL
  manifest: data/phase1/corrected/pilot-v12-model-manifest.json
  runtime_manifest: data/phase1/corrected/runtime-manifest.json
  timeout_seconds: 90
  max_retries: 2
  proxy:
    enabled: true
    public_model: phase1-university-model
    max_calls_per_cell: 40
    image: indic-harness-proxy:phase1-pinned
    egress_network: bridge

storage:
  experiment_dir: data/phase1/corrected/pilot-v12
  database: data/phase1/corrected/pilot-v12/runs.sqlite
  traces_dir: data/phase1/corrected/pilot-v12/traces
  results_dir: data/phase1/corrected/pilot-v12/results
