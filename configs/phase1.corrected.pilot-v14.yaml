# v14 preserves the v13 task and agent images; the proxy now requests streamed
# usage chunks and excludes streamed assistant/reasoning text from traces.
experiment:
  name: phase1_corrected_pilot_v14
  dataset_manifest: benchmark/task_selection.v13.yaml
  translations_manifest: benchmark/translations/phase1.v13.yaml
  prepared_tasks_root: data/phase1/tasks-v13
  agents_manifest: configs/agents.pilot-v14.yaml
  models_manifest: configs/models.yaml
  seed: 1701
  repetitions: 1
  languages: [english, hindi, hinglish]
  tasks:
    - 001-file
    - 016-code-repair-pytest
    - 050-multitable-join-analysis
    - 025-meeting-action-tracker
    - 019-incident-runbook-synthesis
  agents: [react, nanobot, openclaw]
  models: [university_gpu]
  version: corrected-v14

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  max_steps: 40

sandbox:
  mode: docker
  image: indic-harness-phase1:pilot-v13
  network: none

inference:
  provider: university_gpu
  env_file: .env.uni-gpu.local
  requested_model_env: INDIC_UNI_GPU_MODEL
  manifest: data/phase1/corrected/pilot-v14-model-manifest.json
  runtime_manifest: data/phase1/corrected/pilot-v14-runtime-manifest.json
  calibration_manifest: data/phase1/corrected/pilot-v14-calibration.json
  timeout_seconds: 90
  max_retries: 2
  proxy:
    enabled: true
    public_model: phase1-university-model
    max_calls_per_cell: 40
    image: indic-harness-proxy:pilot-v14
    egress_network: bridge

storage:
  experiment_dir: data/phase1/corrected/pilot-v14
  database: data/phase1/corrected/pilot-v14/runs.sqlite
  traces_dir: data/phase1/corrected/pilot-v14/traces
  results_dir: data/phase1/corrected/pilot-v14/results
