agents:
  react:
    type: react

  # These images are intentionally explicit.  The preflight gate must fail if
  # a pinned native runtime is not installed; it must never silently fall back
  # to the old host-process wrappers.
  nanobot:
    type: native
    image: indic-harness-nanobot:phase1-pinned
    image_digest: ""
    release: "0.3.5"
    command: ["nanobot", "agent", "--classic", "--no-markdown", "--no-logs", "--message", "{prompt}", "--session", "{session}", "--workspace", "{workspace}", "--config", "{config}"]
    network: phase1-agent-net

  openclaw:
    type: native
    image: indic-harness-openclaw:phase1-pinned
    image_digest: ""
    release: "2026.9.5"
    command: ["openclaw", "agent", "--local", "--message-file", "{message_file}", "--model", "{model}", "--session-id", "{session}", "--thinking", "off", "--timeout", "{timeout}", "--json"]
    network: phase1-agent-net
