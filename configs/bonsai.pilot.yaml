# One oracle-graded execution per language against the local Bonsai model.
experiment:
  name: bonsai_indic_pilot
  seed: 17
  repetitions: 1
  languages: [english, hindi, hinglish]
  tasks: [001-file]
  agents: [react]
  models: [bonsai_local]

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024

sandbox:
  mode: local
  image: python:3.12-slim

storage:
  database: data/bonsai-pilot-runs.sqlite
  traces_dir: data/traces
  results_dir: data/results
