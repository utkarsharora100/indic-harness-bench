experiment:
  name: phase1_language_comparison
  seed: 17
  repetitions: 3
  languages: [english, hindi, hinglish]
  tasks: [demo]
  agents: [react]
  models: [local]

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048

limits:
  max_steps: 30
  timeout_seconds: 600

sandbox:
  mode: local
  image: python:3.12-slim

storage:
  database: data/runs.sqlite
  traces_dir: data/traces
  results_dir: data/results
