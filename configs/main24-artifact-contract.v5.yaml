    protected: [in/app/test_config.py]
  019-incident-runbook-synthesis:
    required: [out/incident_report.json, out/rollback_plan.md, out/evidence_matrix.csv, out/status_update.md]
    protected: [in/alerts.jsonl, in/change_log.md, in/services.csv, in/topology.json]
  020-archive-checksum:
    required: [out/manifest.json, out/mismatches.txt]
