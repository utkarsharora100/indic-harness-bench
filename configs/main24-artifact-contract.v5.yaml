    required: [out/index.csv, out/reject_ledger.csv, out/batch_summary.json]
    required_any: [out/normalized/*]
    protected: [in/normalization_rules.yaml, in/dropbox/*]
  087-cli-parser-bug-tests:
    required: [in/csvtool/csvtool/cli.py, in/csvtool/tests/test_cli_regression.py]
    protected: [in/csvtool/tests/test_cli_existing.py, in/csvtool/samples/*]
