    protected: [in/emails.json]
  012-doc-synthesis:
    required: [out/trustworthiness.json, out/contradictions.json, out/final_report.md]
    protected: [in/doc1_news_site_a.md, in/doc2_news_site_b.md, in/doc3_social_media.md, in/doc4_official_statement.md, in/doc5_expert_analysis.md]
