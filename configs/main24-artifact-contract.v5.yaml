    required: [in/db/migration.sql, in/db/preflight_report.md, in/db/rollback.sql, in/db/postcheck.sql, in/db/migration_report.md]
    protected: [in/db/schema.sql, in/db/migration_policy.md]
  049-excel-like-cleaning:
    required: [out/cleaned_sales.csv, out/reject_ledger.csv, out/reject_summary.json, out/cleaning_report.md]
    protected: [in/messy_sales.csv, in/customer_dictionary.csv, in/fx_rates.csv]
  050-multitable-join-analysis:
    required: [out/customer_metrics.csv, out/region_summary.json, out/reconciliation_audit.json, out/reconciliation_notes.md]
    protected: [in/customers.csv, in/orders.csv, in/payments.csv, in/refunds.csv, in/fx_rates.csv, in/chargebacks.csv]
  051-sql-query-report:
    required: [out/query_results.json, out/analysis.md, out/query_audit.json]
    protected: [in/schema_data.sql]
  053-anomalous-transaction-detect:
    required: [out/suspicious_transactions.csv, out/rule_audit.json, out/case_notes.md]
    protected: [in/transactions.csv, in/rules.md]
  054-budget-variance-analysis:
    required: [out/variance_report.csv, out/department_rollup.csv, out/review_reasons.json, out/summary.md]
    protected: [in/budget.csv, in/actuals.csv]
  068-product-launch-ops:
    required: [out/launch_plan.md, out/content_pack.json, out/launch_checklist.csv]
    protected: [in/product.md, in/budget.csv, in/audience.json]
