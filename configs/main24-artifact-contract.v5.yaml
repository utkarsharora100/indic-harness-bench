  033-offline-knowledge-qa:
    required: [out/answers.json]
    protected: [in/questions.json, in/docs/*]
  035-conflicting-source-resolution:
    required: [out/resolved_facts.json, out/uncertainties.md, out/conflict_matrix.csv, out/source_reliability.json, out/decision_log.md]
    protected: [in/briefs/*]
