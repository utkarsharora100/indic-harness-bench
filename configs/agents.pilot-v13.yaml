agents:
  react:
    type: react
  nanobot:
    type: native
    image: indic-harness-nanobot:pilot-v13
    release: "0.3.5"
    command: ["nanobot", "agent", "-m", "{prompt}", "--workspace", "{workspace}", "--config", "{config}"]
    network: phase1-agent-net
  openclaw:
    type: native
    image: indic-harness-openclaw:pilot-v13
    release: "2026.9.5"
    command: ["openclaw", "agent", "--local", "--message-file", "{message_file}", "--model", "{model}", "--session-id", "{session}", "--thinking", "off", "--timeout", "{timeout}", "--json"]
    network: phase1-agent-net
