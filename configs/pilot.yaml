# One repetition of each language condition for end-to-end validation.
experiment:
  name: phase1_pilot
  seed: 17
  repetitions: 1
  languages: [english, hindi, hinglish]
  tasks: [001-file]
  agents: [react]
  models: [local]

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048

sandbox:
  mode: local
  image: python:3.12-slim

storage:
  database: data/pilot-runs.sqlite
  traces_dir: data/traces
  results_dir: data/results
