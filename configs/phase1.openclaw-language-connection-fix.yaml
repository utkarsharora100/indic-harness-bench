experiment:
  id: openclaw_language_24_connection_fix
  name: OpenClaw Language Study
  version: openclaw-language-study-connection-fix
  dataset_manifest: benchmark/task_selection.v13.yaml
  translations_manifest: benchmark/translations/phase1.v13.yaml
  artifact_contract: configs/main24-artifact-contract.v5.yaml
  prepared_tasks_root: data/phase1/tasks-v13
  agents_manifest: configs/agents.openclaw-language.yaml
  models_manifest: configs/models.yaml
  seed: 1701
  repetitions: 1
  languages: [english, hindi]
  tasks:
    - 016-code-repair-pytest
    - 039-repo-architecture-map
    - 040-test-coverage-fill
    - 042-api-schema-migration
    - 043-db-migration-safety
    - 087-cli-parser-bug-tests
    - 049-excel-like-cleaning
    - 050-multitable-join-analysis
    - 051-sql-query-report
    - 053-anomalous-transaction-detect
    - 054-budget-variance-analysis
    - 001-file
    - 020-archive-checksum
    - 021-batch-rename-transform
    - 079-smallfile-batch-reject-ledger
    - 004-meeting-summary
    - 005-email-triage
    - 025-meeting-action-tracker
    - 028-email-thread-merge
    - 012-doc-synthesis
    - 033-offline-knowledge-qa
    - 035-conflicting-source-resolution
    - 019-incident-runbook-synthesis
    - 068-product-launch-ops
  agents: [openclaw]
  models: [university_gpu]

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  max_steps: 40

sandbox:
  mode: docker
  image: indic-harness-phase1:pilot-v13
  network: none

inference:
  provider: university_gpu
  env_file: .env.uni-gpu.local
  requested_model_env: INDIC_UNI_GPU_MODEL
  manifest: data/phase1/openclaw-language-study-en-hi-connection-fix/model-manifest.json
  pinned_model_manifest: data/phase1/corrected/pilot-v14-model-manifest.json
  runtime_manifest: data/phase1/openclaw-language-study/runtime-manifest.json
  calibration_manifest: data/phase1/corrected/pilot-v14-calibration.json
  timeout_seconds: 90
  max_retries: 0
  context_window_tokens: 32768
  input_safety_margin_tokens: 2048
  agent_request_max_tokens: 8192
  max_tool_result_bytes: 2048
  outcome_rubric: configs/openclaw-language-study-rubric.yaml
  study_store: data/phase1/openclaw-language-study-en-hi-connection-fix/study.sqlite
  health_check_interval_seconds: 300
  heartbeat: data/phase1/openclaw-language-study-en-hi-connection-fix/heartbeat.json
  journal: data/phase1/openclaw-language-study-en-hi-connection-fix/journal.jsonl
  proxy:
    enabled: true
    public_model: phase1-university-model
    max_calls_per_cell: 40
    image: indic-harness-proxy:phase1-pinned
    egress_network: bridge

storage:
  experiment_dir: data/phase1/openclaw-language-study-en-hi-connection-fix
  database: data/phase1/openclaw-language-study-en-hi-connection-fix/runs.sqlite
  traces_dir: data/phase1/openclaw-language-study-en-hi-connection-fix/traces
  results_dir: data/phase1/openclaw-language-study-en-hi-connection-fix/results
  report_dir: data/phase1/openclaw-language-study-en-hi-connection-fix/report
  heartbeat: data/phase1/openclaw-language-study-en-hi-connection-fix/heartbeat.json
  journal: data/phase1/openclaw-language-study-en-hi-connection-fix/journal.jsonl
