# Research configuration for the 24-task language-only study.
# Populate benchmark/task_selection.yaml with IDs from a pinned Harness-Bench revision first.
experiment:
  name: phase1_language_comparison
  seed: 17
  repetitions: 3
  languages: [english, hindi, hinglish]
  tasks: []
  agents: [react]
  models: [local]

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048

sandbox:
  mode: docker
  image: python:3.12-slim

storage:
  database: data/runs.sqlite
  traces_dir: data/traces
  results_dir: data/results
