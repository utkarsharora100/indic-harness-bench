[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indic-harness-bench"
version = "0.1.0"
description = "Controlled multilingual evaluation for executable AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1,<8",
    "openai>=1.100,<2",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
indic-harness = "runner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agents", "analysis", "benchmark", "runner", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
