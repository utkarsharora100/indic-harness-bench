name: Build complete LLM source corpus
on:
  push:
    branches:
      - llm-export-prishiv-dev-20261010
    paths:
      - tools/build_llm_source.py
      - .github/workflows/build-llm-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: llm-export-prishiv-dev-20261010
          fetch-depth: 0
      - name: Assemble full Markdown from pinned Git commit
        run: python tools/build_llm_source.py
      - name: Commit the generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f LLM_SOURCE.md
          if git diff --cached --quiet -- LLM_SOURCE.md; then
            echo "LLM_SOURCE.md is already up to date."
            exit 0
          fi
          git commit -m "Generate complete LLM-friendly source corpus"
          git push origin HEAD:llm-export-prishiv-dev-20261010
